apiVersion: v1
kind: Service
metadata:
  name: mnist-streamlit-service
spec:
  type: NodePort
  selector:
    app: mnist-full
  ports:
    - name: streamlit
      protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30501
---
apiVersion: v1
kind: Service
metadata:
  name: mnist-flask-service
spec:
  type: NodePort
  selector:
    app: mnist-full
  ports:
    - name: flask
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
